name: Compression compatibility

on:
  pull_request:
    paths:
      - 'src/Arius.Core/Shared/Compression/**'
      - 'src/Arius.Core/Arius.Core.csproj'
      - 'src/Arius.Core.Tests/Shared/Compression/**'
      - 'src/Arius.Core.Tests/Arius.Core.Tests.csproj'
      - 'src/Arius.Benchmarks/CompressionComparison.cs'
      - 'src/Arius.Benchmarks/Program.cs'
      - 'src/Arius.Benchmarks/Arius.Benchmarks.csproj'
      - 'src/Directory.Packages.props'
      - 'Dockerfile'
      - 'recover-chunk.py'
      - '.github/scripts/verify-compression-deployment.py'
      - '.github/scripts/measure-compression.py'
      - '.github/workflows/compression-compatibility.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codec:
    name: Codec, recovery and deployment (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      ARIUS_TEST_PYTHON: python
      ARIUS_E2E_ACCOUNT: ${{ vars.ARIUS_E2E_ACCOUNT }}
      ARIUS_E2E_KEY: ${{ secrets.ARIUS_E2E_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install recovery dependencies
        run: python -m pip install cryptography zstandard
      - name: Verify codec compatibility and independent recovery
        run: dotnet test --project src/Arius.Core.Tests/Arius.Core.Tests.csproj -c Release --treenode-filter "/*/*/Zstd*Tests/*"
      - name: Publish self-contained single-file CLI
        run: >-
          dotnet publish src/Arius.Cli/Arius.Cli.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -o artifacts/cli
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Verify published CLI archive, listing and recovery
        shell: pwsh
        run: |
          $cli = if ($IsWindows) { 'artifacts/cli/Arius.Cli.exe' } else { 'artifacts/cli/Arius.Cli' }
          python .github/scripts/verify-compression-deployment.py --cli $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure both codecs in fresh processes
        shell: pwsh
        run: |
          dotnet build src/Arius.Benchmarks/Arius.Benchmarks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($codec in 'previous', 'framework') {
            foreach ($workload in 'text', 'mixed', 'random') {
              python .github/scripts/measure-compression.py $codec $workload |
                Tee-Object -FilePath artifacts/compression.jsonl -Append
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compression-${{ matrix.rid }}
          path: artifacts/compression.jsonl

  container:
    name: Linux production container compression
    runs-on: ubuntu-latest
    env:
      ARIUS_E2E_ACCOUNT: ${{ vars.ARIUS_E2E_ACCOUNT }}
      ARIUS_E2E_KEY: ${{ secrets.ARIUS_E2E_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install recovery dependencies
        run: python -m pip install cryptography zstandard
      - name: Publish framework-dependent CLI
        run: dotnet publish src/Arius.Cli/Arius.Cli.csproj -c Release --self-contained false -o artifacts/container-cli
      - name: Build production runtime image
        run: docker build --platform linux/amd64 -t arius-zstd-gate .
      - name: Verify compression inside the production runtime image
        run: python .github/scripts/verify-compression-deployment.py --cli artifacts/container-cli/Arius.Cli.dll --image arius-zstd-gate
